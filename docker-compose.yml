services:

  api:
    build: .

    container_name: csmbaseapi-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}

      HOST: ${HOST}
      PORT: ${PORT}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # Inside Docker, Redis is reached through the service name.
      REDIS_URL: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES}
      EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USE_TLS: ${SMTP_USE_TLS}

      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL}

      CORS_ORIGINS: ${CORS_ORIGINS}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - csmbaseapi-network


  db:
    image: postgres:16

    container_name: csmbaseapi-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - csmbaseapi-network


  redis:
    image: redis:7-alpine

    container_name: csmbaseapi-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - csmbaseapi-network


volumes:
  postgres_data:
  redis_data:


networks:
  csmbaseapi-network:
    external: true