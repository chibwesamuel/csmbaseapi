services:

  api:
    build: .

    container_name: csmbaseapi-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_NAME: ${APP_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      REDIS_URL: ${REDIS_URL}

    depends_on:
      - db
      - redis

    networks:
      - csmbaseapi-network

  db:
    image: postgres:16

    container_name: csmbaseapi-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - csmbaseapi-network

  redis:
    image: redis:7-alpine

    container_name: csmbaseapi-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    networks:
      - csmbaseapi-network


volumes:
  postgres_data:
  redis_data:


networks:
  csmbaseapi-network:
    external: true